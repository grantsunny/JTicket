spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JTICKET_OIDC_ISSUER:https://grantsunny.auth0.com/}
          audiences: ${JTICKET_OIDC_AUDIENCE:jticket-auth0-demo}
      client:
        registration:
          jticket:
            provider: oidc
            # Demo Auth0 application values; override with JTICKET_OIDC_CLIENT_ID and JTICKET_OIDC_CLIENT_SECRET for deployments.
            client-id: ${JTICKET_OIDC_CLIENT_ID:sGIuOL9U1DtpD39kofVqAEdSW7BaLdRb}
            client-secret: ${JTICKET_OIDC_CLIENT_SECRET:pJeoD-UJQ559icUZHA15J96-rsza8Xao4i8HU6oKzwrdhCEtfTXZXxRUkfHIK3xa}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          oidc:
            issuer-uri: ${JTICKET_OIDC_ISSUER:https://grantsunny.auth0.com/}
  h2:
    console:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:26257/TKT
    driver-class-name: org.postgresql.Driver
    username: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 3000
      max-lifetime: 180000
      connection-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:postgresql.sql
      continue-on-error: true
ticket:
  oauth2:
    audience: ${JTICKET_OIDC_AUDIENCE:jticket-auth0-demo}
  sqlParams:
    SEATDETAILS: SEATDETAILS
    SEATSINEVENT: SEATSINEVENT
    SKU: SKU
