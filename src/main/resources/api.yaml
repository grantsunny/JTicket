openapi: 3.0.0
info:
  title: Seat Selection API
  description: API for booking seats and managing orders, with support for multiple seat bookings per order. Utilizes UUIDs for unique identification.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/
    description: localhost

paths:
  /events:
    get:
      summary: Get a list of all events
      operationId: listEvents
      parameters:
        - in: query
          name: venueId
          schema:
            type: string
          required: false
          description: venue the event performs.
      responses:
        '200':
          description: A list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      summary: Create a new event
      operationId: createEvent
      parameters:
        - in: header
          name: X-Copy-From-Id
          schema:
            type: string
          required: false
          description: Optional eventId of the resource to copy seat pricing from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '201':
          description: Event created successfully
          headers:
            Location:
              description: Location of the created resource
              schema:
                type: string
        '400':
          description: Invalid input
        '409':
          description: Venue is already booked for the selected time or venue not found
  /events/{eventId}:

    get:
      summary: Get a specific event by UUID
      operationId: getEventById
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
    patch:
      summary: Link a venue with an event
      operationId: assignVenueToEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: linkVenue
              properties:
                venueId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Venue associated with event successfully
        '400':
          description: Invalid input
        '404':
          description: Event not found
        '409':
          description: Venue is already booked for the selected time or venue not found
    put:
      summary: update event
      operationId: updateEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '204':
          description: event updated successfully
        '400':
          description: Invalid input
        '404':
          description: Event not found
        '409':
          description: Venue is already booked for the selected time or venue not found
    delete:
      summary: deleteEvent
      operationId: deleteEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Event deleted successfully
        '409':
          description: Event failed due to constraints
  /events/{eventId}/poster:
    get:
      summary: Download event poster
      operationId: getEventPoster
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event poster image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Event not found
    post:
      summary: Upload or replace event poster
      operationId: uploadEventPoster
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Poster uploaded successfully
        '400':
          description: Invalid input
        '404':
          description: Event not found
        '413':
          description: Poster image is too large
        '415':
          description: Unsupported media type
    delete:
      summary: Clear event poster
      operationId: deleteEventPoster
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Poster deleted successfully
        '404':
          description: Event not found

  /events/{eventId}/sessions:
    get:
      operationId: listSessions
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: list sessions under one event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    post:
      operationId: createSession
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Session'
      responses:
        '201':
          description: Session created successfully
          headers:
            Location:
              description: Location of the created resource
              schema:
                type: string
        '400':
          description: Invalid input
        '409':
          description: Duplicated session (name) found
  /events/{eventId}/sessions/{sessionId}:
    post:
      summary: Redeem a ticket token for event-session check-in.
      operationId: _checkIn
      parameters:
        - name: token
          in: header
          required: true
          schema:
            type: string
            format: jwt
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string        
      responses:
        '200':
          description: > 
            Validates a ticket JWT for the event and session, then updates the seat check-in status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketingSeat'
        '400':
          description: Check-in failed because the ticket token or requested event/session/seat is invalid.
    
    get:
      operationId: getSession
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One session according eventId and sessionId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
    put:
      operationId: updateSession
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Session'
      responses:
        '204':
          description: session updated successfully
        '400':
          description: invalid input
        '404':
          description: session not found
        '409':
          description: conflict name or event in session
    delete:
      operationId: deleteSession
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: session deleted successfully
        '400':
          description: invalid input
        '404':
          description: session not found

  /events/{eventId}/sessions/{sessionId}/statistics:
    get:
      summary: Get check-in statistics for a given event session
      operationId: getSessionStatistics
      description: Retrieve simple seat and check-in counts for one session of an event.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatistics'
        '404':
          description: Event or session not found

  /events/{eventId}/prices:
    get:
      summary: Get a list of prices available under given event
      operationId: listTicketPricesOfEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Price'
    post:
      summary: create a new price for a given event
      operationId: createTicketPriceOfEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Price'
      responses:
        '201':
          description: Price created successfully
          headers:
            Location:
              description: Location of the created resource
              schema:
                type: string
        '400':
          description: Invalid input
        '409':
          description: Duplicated price (Name) found

  /events/{eventId}/prices/{priceId}:
    get:
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: priceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      summary: Get one given ticket prices of a specific event
      operationId: getTicketPriceOfEvent
      responses:
        '200':
          description: Price details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
        '404':
          description: Price not found
    delete:
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: priceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      summary: Remove one given ticket price of a specific event
      operationId: deleteTicketPriceOfEvent
      responses:
        '204':
          description: Price deleted successfully
        '409':
          description: Delete failed due to constraints
        '404':
          description: Price not found

  /events/{eventId}/venue:
    get:
      summary: Get the venue details for a specific event
      operationId: getVenueOfEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Venue details for the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          description: Event or venue not found

  /events/{eventId}/venue/svg:
    get:
      summary: Get areas layout in SVG format
      operationId: getEventVenueSvgLayout
      description: Retrieve details of a specific venue by event's UUID.
      parameters:
        - name: eventId
          in: path
          required: true
          description: Unique ID of the event
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: The areas layout in SVG format
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        404:
          description: event or venue not found

  /events/{eventId}/pricing:
    get:
      summary: Get the default price of the event
      operationId: getDefaultPricingOfEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Venue level price for the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
        '404':
          description: There is no venue level price for this event, or venue is not assigned.
    patch:
      summary: Assign a venue level price to the event.
      operationId: assignDefaultPricingOfEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: linkPrice
              properties:
                priceId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Assigned the price successfully
        '400':
          description: Invalid input
        '404':
          description: Event not found, or not associated with venue

  /events/{eventId}/areas:
    get:
      summary: List areas in a event
      operationId: getAllAreasInEvent
      description: Retrieve a list of areas of the venue, within a specific event.
      parameters:
        - name: eventId
          in: path
          required: true
          description: Unique ID of the event
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: A list of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
        404:
          description: Event not found, or not mapped with any venue yet

  /events/{eventId}/areas/{areaId}:
    get:
      summary: Get a specific area in a venue mapped with an event.
      operationId: getAreaInEvent
      description: Retrieve details of a specific area within a venue.
      parameters:
        - name: eventId
          in: path
          required: true
          description: Unique ID of the event
          schema:
            type: string
            format: uuid
        - name: areaId
          in: path
          required: true
          description: Unique ID of the area
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Details of a specific area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        404:
          description: Area not found

  /events/{eventId}/areas/{areaId}/pricing:
    get:
      summary: Get the area level price of the event
      operationId: getAreaLevelPricingOfEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: areaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Area pricing state for the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingState'
        '404':
          description: Event or area not found.
    patch:
      summary: Assign or clear an area level price for the event.
      operationId: assignAreaLevelPricingOfEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: areaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: linkPrice
              properties:
                priceId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Updated the area pricing state successfully
        '400':
          description: Invalid input
        '404':
          description: Event not found, or not associated with venue

  /events/{eventId}/areas/{areaId}/seats:
    get:
      summary: List seats in an area of a venue (SKU)
      operationId: getAllSeatsInAreaOfEvent
      description: Retrieve a list of seats within a specific area of a specific event.
      parameters:
        - name: eventId
          in: path
          required: true
          description: Unique ID of the event
          schema:
            type: string
            format: uuid
        - name: areaId
          in: path
          required: true
          description: Unique ID of the area
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: A list of seats within the area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketingSeat'
        404:
          description: Area or Venue not found

  /events/{eventId}/sessions/{sessionId}/areas/{areaId}/seats:
    get:
      summary: List seat occupation in an area for one event session
      operationId: getAllSeatsInAreaOfSession
      description: Retrieve seats in an event area with session-specific occupation and check-in status.
      parameters:
        - name: eventId
          in: path
          required: true
          description: Unique ID of the event
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          description: Unique ID of the session
          schema:
            type: string
            format: uuid
        - name: areaId
          in: path
          required: true
          description: Unique ID of the area
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: A list of seats with session-specific occupation status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketingSeat'
        404:
          description: Event, session, or area not found

  /events/{eventId}/seats/{seatId}:
    get:
      summary: Get a specific seat with details (SKU) under given event
      operationId: getSeatInEvent
      description: Retrieve details of a specific seat by its UUID.
      parameters:
        - name: eventId
          in: path
          required: true
          description: Unique UUID of the event
          schema:
            type: string
            format: uuid
        - name: seatId
          in: path
          required: true
          description: Unique UUID of the seat
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Details of a specific seat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketingSeat'
        '404':
          description: Seat not found

  /events/{eventId}/seats/{seatId}/pricing:
    get:
      summary: Get the seat level price of the event
      operationId: getSeatLevelPricingOfEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: seatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Seat pricing state for the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingState'
        '404':
          description: Event or seat not found.
    patch:
      summary: Assign or clear a seat level price for the event.
      operationId: assignSeatLevelPricingOfEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: seatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: linkPrice
              properties:
                priceId:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Updated the seat pricing state successfully
        '400':
          description: Invalid input
        '404':
          description: Event not found, or not associated with venue

  /events/{eventId}/orders:
    get:
      summary: Get all the orders of a given event
      operationId: getEventOrders
      description: Retrieve all orders for an event. Intended for operators with order:read:all.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '404':
          description: Event not found

  /events/{eventId}/statistics:
    get:
      summary: Get check-in statistics for a given event
      operationId: getEventStatistics
      description: Retrieve simple seat and check-in counts for an event.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatistics'
        '404':
          description: Event not found
          
  /venues:
    get:
      summary: List all venues
      operationId: getAllVenues
      description: Retrieve a list of all venues.
      responses:
        200:
          description: A list of venues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Venue'

  /venues/{venueId}:
    get:
      summary: Get specific venue
      operationId: getVenue
      description: Retrieve details of a specific venue by its UUID.
      parameters:
        - name: venueId
          in: path
          required: true
          description: Unique ID of the venue
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Details of a specific venue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        404:
          description: Venue not found

  /venues/{venueId}/areas:
    get:
      summary: List areas in a venue
      operationId: getAllAreasInVenue
      description: Retrieve a list of areas within a specific venue.
      parameters:
        - name: venueId
          in: path
          required: true
          description: Unique ID of the venue
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: A list of areas within the venue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'

  /venues/{venueId}/svg:
    get:
      summary: Get areas layout in SVG format
      operationId: getVenueSvgLayout
      description: Retrieve details of a specific venue by its UUID.
      parameters:
        - name: venueId
          in: path
          required: true
          description: Unique ID of the venue
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: The areas layout in SVG format
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        404:
          description: Venue not found

  /venues/{venueId}/areas/{areaId}:
    get:
      summary: Get a specific area in a venue
      operationId: getAreaInVenue
      description: Retrieve details of a specific area within a venue.
      parameters:
        - name: venueId
          in: path
          required: true
          description: Unique ID of the venue
          schema:
            type: string
            format: uuid
        - name: areaId
          in: path
          required: true
          description: Unique ID of the area
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Details of a specific area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        404:
          description: Area not found

  /venues/{venueId}/seats:
    get: 
      summary: List all seats of venue
      operationId: getSeatsInVenue
      description: Retrieve a list of seats within a venue. 
      parameters:
        - name: venueId
          in: path
          required: true
          description: Unique ID of the venue
          schema:
            type: string
            format: uuid
        - name: areaId
          in: query
          required: false
          description: Unique ID of the area
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: A list of seats within the venue or area (if query param specified)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
        404:
          description: Area or Venue not found
                    
  /venues/{venueId}/seats/{seatId}:  
    get:
      summary: Get a specific seat within Venue
      operationId: getSeatInVenue
      description: Retrieve details of a specific seat within Venue by its UUID.
      parameters:
        - name: venueId
          in: path
          required: true
          description: Unique ID of the venue
          schema:
            type: string
            format: uuid        
        - name: seatId
          in: path
          required: true
          description: Unique UUID of the seat
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Details of a specific seat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seat'
        '404':
          description: Seat not found
          
  /venues/{venueId}/areas/{areaId}/seats:
    get:
      summary: List seats in an area of a venue
      operationId: getAllSeatsInAreaOfVenue
      description: Retrieve a list of seats within a specific area of a specific venue.
      parameters:
        - name: venueId
          in: path
          required: true
          description: Unique ID of the venue
          schema:
            type: string
            format: uuid
        - name: areaId
          in: path
          required: true
          description: Unique ID of the area
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: A list of seats within the area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
        404:
          description: Area or Venue not found

  /seats:
    get:
      summary: Get all seats or filter by venue and area
      operationId: getAllSeats
      description: Retrieve a list of all seats with their current status. Optionally, filter seats by area using the `areaId` query parameter.
      parameters:
        - name: venueId
          in: query
          schema:
            type: string
            format: uuid
          required: true
          description: Required UUID of the venue to filter seats by.
        - name: areaId
          in: query
          schema:
            type: string
            format: uuid
          required: false
          description: Optional UUID of the area to filter seats by.

      responses:
        '200':
          description: A list of seats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'

  /seats/{seatId}:
    get:
      summary: Get a specific seat
      operationId: getSeat
      description: Retrieve details of a specific seat by its UUID.
      parameters:
        - name: seatId
          in: path
          required: true
          description: Unique UUID of the seat
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Details of a specific seat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seat'
        '404':
          description: Seat not found

  /orders:
    get:
      summary: Get a list of orders
      operationId: getAllOrders
      description: Retrieve orders within an optional time range. Customers see their own orders; operators with order:read:all can see all orders.
      parameters:
        - name: startTime
          in: query
          schema:
            type: string
            format: date-time
          required: false
          description: Optional start timestamp for filtering orders.
        - name: endTime
          in: query
          schema:
            type: string
            format: date-time
          required: false
          description: Optional end timestamp for filtering orders.
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

    post:
      summary: Create an order
      operationId: createOrder
      description: Create a new order with multiple seat selections for the authenticated customer.
      requestBody:
        description: Order creation request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Bad request
        '409':
          description: Order conflicts with an existing booking, such as a seat already booked for the same session.

  /orders/{orderId}:
    get:
      summary: Get a specific order
      operationId: getOrder
      description: Retrieve details of a specific order by its UUID. Customers can retrieve only their own orders; operators with order:read:all can retrieve any order.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique UUID of the order
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Details of a specific order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

    patch:
      summary: Mark an order as paid
      operationId: payOrder
      description: Mark an order as paid. Intended for payment agents with order:pay; no customer owner check is required.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique UUID of the order
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: payment
              required:
                - paymentChannel
                - paymentTransactionId
                - paymentAmount
              properties:
                paymentChannel:
                  type: string
                  description: Payment vendor or channel, for example paypal, alipay, wechatpay, or applepay.
                paymentTransactionId:
                  type: string
                  description: Vendor-generated transaction identifier used for idempotency.
                paymentAmount:
                  type: integer
                  description: Payment amount in cents.
      responses:
        '202':
          description: Payment accepted. Returned for both a first successful payment and an idempotent retry with the same channel, transaction id, and amount.
        '400':
          description: Invalid input, including a missing payment channel, transaction id, or positive payment amount.
        '404':
          description: Order not found.
        '406':
          description: Payment amount is less than the resolved order total and underpayment is not accepted by configuration.
        '409':
          description: Payment request conflicts with the existing order payment, such as a different transaction id, channel, or amount.

    delete:
      summary: Cancel an order
      operationId: cancelOrder
      description: Cancel a specific order. Customers can cancel only their own orders; operators with order:write:all can cancel any order.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique UUID of the order to cancel
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Order canceled successfully
        '404':
          description: Order not found or already paid
        '500':
          description: Internal server error

  /orders/{orderId}/token:
    post:
      summary: generateOrderTicketJwtToken
      operationId: _createCheckInToken
      description: > 
        Create corresponding ticket object (for QR code) in JWT token format by supplying one seatId, 
        with signature. Customers can create QR tokens only for their own paid orders; operators with order:read:all can create QR tokens for any paid order.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique UUID of the order to cancel
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: linkSeat
              properties:
                seatId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Created a token for a ticket, valid for 5 minutes by default
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: No such seat or order
        '400':
          description: Client error, for example, the order is not paid
        '500':
          description: Internal server error

components:
  schemas:

    Ticket:
      type: object
      description: >
        JWT (JSON Web Token) used for authentication and access control. The JWT is
        provided as a Base64 URL-encoded string consisting of three parts: header,
        payload, and signature. Here is example payload before encoded as base64:
        
        {
          "sub": "user123456",
          "exp": 1692995200,  // Represents an expiration time in Unix time (e.g., Thu, 24 Sep 2023 00:00:00 GMT)
          "iat": 1692918800,  // Represents the time the JWT was issued (Unix time)
          "event": "evt123",
          "session": "sess456",
          "venue": "ven789",
          "seat": "seat001",
          "area": "area321",
          "row": "12",
          "col": "34",
          "price_name": "VIP"
        }

      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
      required:
        - token
      properties:
        token:
          type: string

    Event:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        venueId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: true  # Allows any set of properties

    Session:
      type: object
      required:
        - eventId
        - name
        - startTime
        - endTime
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        eventId:
          type: string
          format: uuid
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true  # Allows any set of properties

    Price:
      type: object
      required:
        - name
        - eventId
        - price
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        eventId:
          type: string
          format: uuid
        price:
          type: integer
          description: Price in cents.

    PricingState:
      type: object
      properties:
        priceId:
          type: string
          format: uuid
          description: Directly assigned price ID for this seat or area.
        effectivePricing:
          $ref: '#/components/schemas/EffectivePricing'

    EffectivePricing:
      type: object
      properties:
        priceId:
          type: string
          format: uuid
          description: Resolved price ID after applying seat, area, and default event pricing.
        name:
          type: string
          description: Resolved price name after applying seat, area, and default event pricing.
        price:
          type: integer
          description: Resolved price in cents after applying seat, area, and default event pricing.
        source:
          type: string
          enum:
            - seat
            - area
            - default
            - none
          description: Source of the effective price.

    Venue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true

    Area:
      type: object
      properties:
        id:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true

    Seat:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
          description: Unique ID of the venue to which this seat belongs
        areaId:
          type: string
          format: uuid
          description: Unique ID of the area to which this seat belongs
        row:
          type: integer
        col:
          type: integer
        available:
          type: boolean
        metadata:
          type: object
          additionalProperties: true

    TicketingSeat:
      allOf:
        - $ref: '#/components/schemas/Seat'
        - type: object
          properties:
            price:
              type: integer
              description: Resolved seat price in cents when loaded in a ticketing context.
            priceName:
              type: string
              description: Name of the resolved ticket price when loaded in a ticketing context.
            sold:
              type: boolean
              description: True when this seat has at least one order in the event ticketing context.
            sessionId:
              type: string
              format: uuid
              description: Session where this physical seat ticketing status applies.
            status:
              type: string
              enum:
                - open
                - booked
                - checkedIn
              description: Ticketing status of this seat in the session context.
            orderId:
              type: string
              format: uuid
              description: Order occupying this seat for the session.
            userId:
              type: string
              description: User owning the occupying order for the session.
            checkedInTimestamp:
              type: string
              format: date-time
              description: Check-in timestamp when this ticketing seat is correlated with an order.

    EventStatistics:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        totalSeats:
          type: integer
          description: Total seats available in the event venue layout.
        orderedSeats:
          type: integer
          description: Seats currently associated with orders for the event.
        checkedInSeats:
          type: integer
          description: Ordered seats that have already been checked in.
        uncheckedInSeats:
          type: integer
          description: Ordered seats that have not been checked in yet.

    SessionStatistics:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        totalSeats:
          type: integer
          description: Total seats available in the event venue layout for this session.
        orderedSeats:
          type: integer
          description: Seats currently associated with orders for this session.
        checkedInSeats:
          type: integer
          description: Ordered seats that have already been checked in for this session.
        uncheckedInSeats:
          type: integer
          description: Ordered seats that have not been checked in yet for this session.

    Order:
      type: object
      required:
        - eventId
        - sessionId
        - seats
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the order (UUID).
        userId:
          type: string
          description: UserId (the format is still TBD)
        eventId:
          type: string
          format: uuid
          description: Unique ID of the event booked in the order. (Required)
        sessionId:
          type: string
          format: uuid
          description: Unique ID of the event booked in the order. (Required)
        seats:
          type: array
          items:
            $ref: '#/components/schemas/TicketingSeat'
          description: An array of session-context seats booked in the order. (Required)
        paymentChannel:
          type: string
          description: Payment vendor or channel, for example paypal, alipay, wechatpay, or applepay.
        paymentTransactionId:
          type: string
          description: Vendor-generated transaction identifier used for idempotency.
        paymentAmount:
          type: integer
          description: The total amount paid for the order. (in *cents*)
        paymentTimestamp:
          type: string
          format: date-time
          description: Timestamp indicating when the order payment was first applied.
        timestamp:
          type: string
          format: date-time
          description: Timestamp indicating when the order was created.
        metadata:
          type: object
          additionalProperties: true
